<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#C5CCD6" />
      <stop offset="70%" stop-color="#7B8391" />
      <stop offset="100%" stop-color="#E2E7ED" />
    </linearGradient>
    <linearGradient id="gacRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D27" />
      <stop offset="100%" stop-color="#B31217" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- GAC Emblem Badge -->
  <g transform="translate(10, 10)" filter="url(#subtleGlow)">
    <!-- Outer Red Ring Accent -->
    <ellipse cx="50" cy="50" rx="46" ry="46" fill="none" stroke="url(#gacRed)" stroke-width="4.5" stroke-dasharray="210 20"/>
    
    <!-- Outer Chrome Ring -->
    <path d="M 50 12 A 38 38 0 1 0 88 50 L 74 50 A 24 24 0 1 1 50 26 A 24 24 0 0 1 72 38 L 83 27 A 38 38 0 0 0 50 12 Z" fill="url(#metalGrad)" />
    
    <!-- Stylized Wing / Horizontal Crossbar -->
    <path d="M 50 42 L 86 42 L 86 58 L 50 58 Z" fill="url(#metalGrad)" />
    
    <!-- Central Red Core Jewel -->
    <circle cx="50" cy="50" r="10" fill="url(#gacRed)" />
  </g>

  <!-- Typography: GAC MOTOR -->
  <g transform="translate(130, 72)">
    <text font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="currentColor" class="brand-text-gac">
      GAC <tspan fill="url(#gacRed)">MOTOR</tspan>
    </text>
    <text y="24" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="13" letter-spacing="6" fill="#8892A2" text-transform="uppercase">
      SISTEMA DE INVENTARIO
    </text>
  </g>
</svg>
